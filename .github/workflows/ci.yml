name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: python scripts/make_samples.py && python scripts/make_passbook_image.py
      - run: python -m pytest -q
      - name: validate rulebook against schema
        run: pip install jsonschema && python -c "import json,jsonschema;jsonschema.validate(json.load(open('rulebook/rules.json')),json.load(open('rulebook/schema.json')));print('rulebook ok')"
