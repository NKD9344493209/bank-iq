[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-iq"
version = "1.0.0"
description = "Bank IQ — a Regulatory Digital Twin for Indian bank customers with a classical machine-learning intelligence layer: transaction categorisation, customer segmentation, spend forecasting and anomaly flags on top of the RBI rule engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - All rights reserved"}
authors = [{name = "Sandhru Duraisamy, Coimbatore Institute of Technology"}]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pydantic>=2.5", "pdfplumber>=0.11", "pytesseract>=0.3.10", "Pillow>=10.0", "python-dateutil>=2.8", "openpyxl>=3.1", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8"]

[project.scripts]
bankiq = "vasool.__main__:main"

[tool.setuptools.packages.find]
include = ["vasool*", "api*", "bankiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
